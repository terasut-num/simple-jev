name: Evaluation tooling

on:
  push:
    paths:
      - 'eval/**'
      - '.github/workflows/test-evaluations.yml'
  pull_request:
    paths:
      - 'eval/**'
      - '.github/workflows/test-evaluations.yml'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s eval -p 'test_*.py'
      - run: python eval/run.py --preset full --list
      - run: python eval/catalog.py --write-doc
